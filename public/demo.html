<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detour · Live demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: #0d1117; overflow: hidden; }
    .demo-top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; color: #e6e9ee; border-bottom: 1px solid #232a33; }
    .demo-top a.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 0; }
    .demo-top .mark { width: 22px; height: 22px; }
    .demo-top .sub { color: #8b95a3; font-size: 12px; }
    .demo-top nav { margin-left: auto; display: flex; gap: 14px; font-size: 12.5px; }
    .demo-top nav a { color: #8b95a3; text-decoration: none; }
    .demo-top nav a:hover { color: #fff; }
    #dock-slot { border-bottom: 1px solid #232a33; }
    .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 14px; padding: 14px; }
    .pane { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .pane-label { color: #8b95a3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; display: flex; justify-content: space-between; }
    .pane-label a { color: #5cc8bc; text-decoration: none; text-transform: none; letter-spacing: 0; }
    iframe { flex: 1; width: 100%; border: 0; border-radius: 12px; background: #fff; }
    .phone-frame { flex: 1; min-height: 0; border-radius: 30px; padding: 8px; background: #1d232b; box-shadow: inset 0 0 0 1px #2b333d; display: flex; }
    .phone-frame iframe { border-radius: 23px; }
    @media (max-width: 960px) { .stage { grid-template-columns: 1fr; overflow-y: auto; } .pane.app iframe { min-height: 700px; } .phone-frame { min-height: 720px; } body { overflow: auto; } }
  </style>
</head>
<body>
  <header class="demo-top">
    <a class="brand" href="/" style="color:inherit;text-decoration:none">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 21.5c3.2 0 4.2-2.2 5.4-5.2 1.3-3.2 2.6-5.8 6.6-5.8h2.5" /><path d="M19.5 7.5l3 3-3 3" /></svg>
      <span>Detour</span>
    </a>
    <span class="sub">Live demo · company app and traveller app, side by side</span>
    <nav><a href="/">Overview</a><a href="/app" target="_blank" rel="noopener">Company app</a><a href="/traveller" target="_blank" rel="noopener">Traveller app</a></nav>
  </header>
  <div id="dock-slot"></div>
  <main class="stage">
    <section class="pane app">
      <div class="pane-label"><span>Company · Northwind Robotics</span><a href="/app" target="_blank" rel="noopener">Open full screen</a></div>
      <iframe src="/app?embed" title="Detour company app"></iframe>
    </section>
    <section class="pane">
      <div class="pane-label"><span>Traveller · Ada's phone</span><a href="/traveller" target="_blank" rel="noopener">Open</a></div>
      <div class="phone-frame"><iframe src="/traveller?embed&amp;tab=messages" title="Detour traveller app"></iframe></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="demo-dock.js"></script>
  <script>
    let toastTimer;
    window.DetourToast = (text) => {
      const t = document.getElementById('toast');
      t.textContent = text; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
    };
    DetourDock.mount({ inline: true });
    // ?snapshot (for screenshots): load once and pass it on to the embedded apps.
    if (new URLSearchParams(location.search).has('snapshot')) {
      document.querySelectorAll('iframe').forEach((f) => { f.src += '&snapshot'; });
      fetch('/api/state').then((r) => r.json()).then(DetourDock.update);
    } else {
      const events = new EventSource('/events');
      events.onmessage = (e) => DetourDock.update(JSON.parse(e.data));
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Detour">
  <title>Detour · Travel manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="tv-body">
  <div class="tv">
    <header class="tv-top">
      <div class="tv-brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 21.5c3.2 0 4.2-2.2 5.4-5.2 1.3-3.2 2.6-5.8 6.6-5.8h2.5" /><path d="M19.5 7.5l3 3-3 3" /></svg>
        <span>Detour</span>
      </div>
      <a class="tv-switch" href="/app?choose" title="Switch role">Travel manager</a>
    </header>

    <main class="tv-screens">
      <section class="tv-screen active" data-screen="home">
        <div class="mg-greet" id="mg-greet"></div>
        <div id="mg-decision"></div>
        <div class="tv-card" id="mg-live"></div>
        <div class="tv-card" id="mg-itinerary"></div>
        <div class="tv-card" id="mg-trips"></div>
        <p class="tv-fine" id="mg-fine"></p>
      </section>

      <section class="tv-screen" data-screen="approvals">
        <div class="mg-title"><h1>Approvals</h1><p>Anything outside policy waits for you, with the evidence attached.</p></div>
        <div class="tv-card" id="mg-approvals"></div>
      </section>

      <section class="tv-screen" data-screen="payments">
        <div class="mg-title"><h1>Payments</h1><p id="mg-pay-intro"></p></div>
        <div class="mg-stats" id="mg-pay-stats"></div>
        <div class="tv-card" id="mg-payments"></div>
      </section>

      <section class="tv-screen" data-screen="log">
        <div class="mg-title"><h1>Decision log</h1><p>Every input Detour received and every decision it made.</p></div>
        <div class="mg-chips" id="mg-filters"></div>
        <div class="tv-card" id="mg-log"></div>
      </section>

      <section class="tv-screen" data-screen="policy">
        <div class="mg-title"><h1>Policy</h1><p>These rules set every amount. The agent can only propose a change.</p></div>
        <div class="tv-card" id="mg-rules"></div>
        <div class="tv-card" id="mg-rates"></div>
        <div class="tv-card" id="mg-connections"></div>
      </section>
    </main>

    <nav class="tv-tabs five">
      <button data-screen="home" class="active"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>Home</button>
      <button data-screen="approvals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>Approvals<span class="tv-badge" id="mg-badge"></span></button>
      <button data-screen="payments"><svg viewBox="0 0 24 24"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>Payments</button>
      <button data-screen="log"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Log</button>
      <button data-screen="policy"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8 7.5 9.5 4.4-1.5 7.5-4.9 7.5-9.5V6z"/></svg>Policy</button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="demo-dock.js"></script>
  <script src="mobile.js"></script>
  <script src="manager.js"></script>
</body>
</html>

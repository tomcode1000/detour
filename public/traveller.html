<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Detour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="traveller.css">
</head>
<body class="tv-body">
  <div class="tv">
    <header class="tv-top">
      <div class="tv-brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 21.5c3.2 0 4.2-2.2 5.4-5.2 1.3-3.2 2.6-5.8 6.6-5.8h2.5" /><path d="M19.5 7.5l3 3-3 3" /></svg>
        <span>Detour</span>
      </div>
      <div class="tv-org" id="tv-org"></div>
    </header>

    <main class="tv-screens">
      <section class="tv-screen active" data-screen="trip">
        <div class="tv-hero" id="tv-hero"></div>
        <div class="tv-card" id="tv-flight"></div>
        <div class="tv-card" id="tv-hotel" hidden></div>
        <div class="tv-card" id="tv-money"></div>
        <p class="tv-fine" id="tv-fine"></p>
      </section>

      <section class="tv-screen" data-screen="messages">
        <div class="tv-chat" id="tv-chat"></div>
        <form class="tv-composer" id="tv-form">
          <input id="tv-text" autocomplete="off" placeholder="Message Detour">
          <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </form>
      </section>
    </main>

    <nav class="tv-tabs" id="tv-tabs">
      <button data-screen="trip" class="active"><svg viewBox="0 0 24 24"><path d="M3 12.5 21 6l-4.5 15-4-6.5z"/><path d="m12.5 14.5 4-4"/></svg>Trip</button>
      <button data-screen="messages"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/></svg>Messages<span class="tv-badge" id="tv-badge"></span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="demo-dock.js"></script>
  <script src="traveller.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Detour">
  <title>Detour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body class="tv-body">
  <div class="tv">
    <header class="tv-top">
      <div class="tv-brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 21.5c3.2 0 4.2-2.2 5.4-5.2 1.3-3.2 2.6-5.8 6.6-5.8h2.5" /><path d="M19.5 7.5l3 3-3 3" /></svg>
        <span>Detour</span>
      </div>
      <a class="tv-switch" href="/app?choose" title="Switch role">Traveller</a>
    </header>

    <main class="tv-screens">
      <section class="tv-screen active" data-screen="trip">
        <div class="tv-hero" id="tv-hero"></div>
        <div class="tv-card" id="tv-flight"></div>
        <div class="tv-card" id="tv-inbox"></div>
        <div class="tv-card" id="tv-hotel" hidden></div>
        <div class="tv-card" id="tv-money"></div>
        <p class="tv-fine" id="tv-fine"></p>
      </section>

      <section class="tv-screen" data-screen="messages">
        <div class="tv-chat" id="tv-chat"></div>
        <form class="tv-composer" id="tv-form">
          <input id="tv-text" autocomplete="off" placeholder="Message Detour">
          <button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </form>
      </section>
    </main>

    <!-- Share an airline message: paste, screenshot (read on the phone), or Android share -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="sheet" hidden aria-label="Share an airline message">
      <div class="sheet-grab"></div>
      <h2>Share an airline message</h2>
      <p class="sheet-sub">Paste the airline's email or text, or add a screenshot. Detour checks it against your flight status before anything changes.</p>
      <textarea id="sheet-text" rows="6" placeholder="Paste the message here"></textarea>
      <div class="sheet-row">
        <label class="btn" for="sheet-file"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m20.5 16-5-5-8 8"/></svg>Add screenshot</label>
        <input type="file" id="sheet-file" accept="image/*" hidden>
        <span class="sheet-status" id="sheet-status"></span>
      </div>
      <p class="sheet-note">Screenshots are read on your phone. Only the text is sent, never the image.</p>
      <div class="sheet-actions"><button class="btn lg-touch" id="sheet-cancel" type="button">Cancel</button><button class="btn primary lg-touch" id="sheet-send" type="button">Send to Detour</button></div>
    </section>

    <nav class="tv-tabs" id="tv-tabs">
      <button data-screen="trip" class="active"><svg viewBox="0 0 24 24"><path d="M3 12.5 21 6l-4.5 15-4-6.5z"/><path d="m12.5 14.5 4-4"/></svg>Trip</button>
      <button data-screen="messages"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/></svg>Messages<span class="tv-badge" id="tv-badge"></span></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="demo-dock.js"></script>
  <script src="mobile.js"></script>
  <script src="traveller.js"></script>
</body>
</html>
